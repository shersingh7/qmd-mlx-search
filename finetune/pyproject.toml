[project]
name = "qmd-finetune"
version = "0.1.0"
description = "QMD query expansion fine-tuning tools"
# Pillow 13 and the audited training stack require Python 3.11 or newer.
requires-python = ">=3.11"
dependencies = [
  "torch>=2.13.0,<3",
  "trl>=1.17.1,<1.18",
  "peft>=0.21.3,<0.22",
  "transformers>=5.22.2,<5.23",
  "accelerate>=1.15.0,<1.16",
  "huggingface_hub>=2.4.0,<3",
  "trackio>=0.45.1,<0.46",
  "datasets>=5.2.0,<5.3",
  "pyyaml>=6.0.3,<7",
  "gguf",
  "sentencepiece>=0.2.1",
  "nvidia-ml-py",
  "pydantic>=2.12.3,<3",
]

[dependency-groups]
dev = ["pytest>=9.0,<10", "packaging>=26.0"]
onnx = ["onnx>=1.23.2", "onnxruntime>=1.32.0", "onnx-ir>=1.1.0", "onnxscript>=0.7.2"]

[tool.uv]
# Constraints apply when a package is present; they do not add unused packages.
# Keep PEP 723 runners in sync with tools/sync_script_dependencies.py.
# The two null-first-patched advisories require the separate security review;
# selecting a later version is not, by itself, evidence of a security fix.
constraint-dependencies = [
  "accelerate>=1.15.0",
  "aiohttp>=3.14.4",
  "anyio>=4.14.2",
  "authlib>=1.9.1",
  "brotli>=1.2.1",
  "certifi>=2026.10.18",
  "cryptography>=50.0.0",
  "datasets>=5.0.1",
  "filelock>=4.2.1",
  "fsspec>=2026.6.0",
  "gradio>=6.16.0",
  "idna>=3.15",
  "multidict>=6.9.1",
  "pillow>=13.0.0",
  "pyarrow>=23.0.1",
  "pygments>=2.20.0",
  "python-multipart>=0.0.31",
  "requests>=2.33.0",
  "setuptools>=84.1.0",
  "starlette>=1.3.1",
  "torch>=2.13.0",
  "transformers>=5.10.0",
  "urllib3>=2.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
