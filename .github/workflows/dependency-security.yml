name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fixed commands/versions only: no PR title, branch or other event payload enters a shell.
permissions:
  contents: read

jobs:
  dependency-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON_DOWNLOADS: never
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure managed temporary paths
        # runner is unavailable in job-level env; RUNNER_TEMP is trusted runner state.
        run: |
          printf 'TMPDIR=%s\nUV_CACHE_DIR=%s/uv-security-cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-free security tooling
        run: python -m pip install uv==0.11.18 -r scripts/security_audit_requirements.txt
      - run: python -m pip check
      - name: Advisory parser and fail-closed regression tests
        run: python -m pytest test/security -q
      - name: Verify both Node locks without lifecycle hooks
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.33.0 install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Reject retained vulnerabilities and validate every source before resolution
        run: python scripts/check_dependency_security.py --output "$RUNNER_TEMP/dependency-baseline.json"
      - name: Check project and every standalone lock without running product code
        # The preceding guard validated these canonical repository-relative paths.
        # argv lists, not shell interpolation, carry the fixed policy inventory.
        run: |
          uv lock --check --no-build --project finetune
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          policy = json.loads(Path('docs/security/dependency-remediation/patched-dependencies.json').read_text())
          runners = policy['accelerate']['runner_paths']
          for runner in runners:
              subprocess.run(['uv', 'lock', '--check', '--no-build', '--script', runner], check=True)
          print(f'Validated {len(runners)} standalone resolver graphs without executing their scripts')
          PY
      - name: Fresh schema-validated npm registry audit (all severities)
        # Bun 1.3.8 can exit 0 on empty/error responses; validate the actual API body.
        run: python scripts/check_dependency_security.py --npm-online --output "$RUNNER_TEMP/dependency-npm.json"
      - name: Fresh OSV scan across all resolved platforms and versions
        run: python scripts/check_dependency_security.py --online --output "$RUNNER_TEMP/dependency-online.json"
      - name: Preserve dependency scan receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-receipts
          path: ${{ runner.temp }}/dependency-*.json
          if-no-files-found: warn
