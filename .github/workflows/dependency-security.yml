name: Dependency security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fixed commands/versions only: no PR title, branch or other event payload enters a shell.
permissions:
  contents: read

jobs:
  dependency-safety:
    runs-on: ubuntu-latest
    env:
      TMPDIR: ${{ runner.temp }}
      UV_CACHE_DIR: ${{ runner.temp }}/uv-security-cache
      UV_PYTHON_DOWNLOADS: never
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model-free security tooling
        run: python -m pip install uv==0.11.18 -r scripts/security_audit_requirements.txt
      - run: python -m pip check
      - name: Advisory parser and fail-closed regression tests
        run: python -m pytest test/security/test_dependency_security.py -q
      - name: Verify both Node locks without lifecycle hooks
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npx --yes pnpm@10.33.0 install --lockfile-only --frozen-lockfile --ignore-scripts
      - name: Verify fine-tuning resolver lock without training or model downloads
        run: uv lock --check --no-build --project finetune
      - name: Reject every retained vulnerable dependency instance
        run: python scripts/check_dependency_security.py --output "$RUNNER_TEMP/dependency-baseline.json"
      - name: Fresh npm registry audit (all severities)
        run: bun audit --audit-level=low
      - name: Fresh OSV scan across all resolved platforms and versions
        run: python scripts/check_dependency_security.py --online --output "$RUNNER_TEMP/dependency-online.json"
      - name: Preserve dependency scan receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-receipts
          path: ${{ runner.temp }}/dependency-*.json
          if-no-files-found: warn
