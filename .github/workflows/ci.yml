name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  javascript:
    name: ${{ matrix.runtime }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQLite (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Install SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite
      # One committed resolver graph, regardless of the runtime under test.
      # Only the SQLite addon gets an explicit native build approval for Node.
      - name: Frozen dependencies (no implicit lifecycle scripts)
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build Node SQLite addon for the Vitest runner
        run: npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Static macOS bootstrap metadata (no added interpreter launch)
        if: runner.os == 'macOS'
        env:
          QMD_DIAGNOSTIC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QMD_DIAGNOSTIC_MATRIX_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          node test/helpers/recovery-bootstrap-diagnostics.mjs --metadata "$RUNNER_TEMP/qmd-recovery-bootstrap"
      - name: Full source build
        run: python scripts/run-offline.py npm run build
      - name: Real launcher argv/runtime tests
        run: python scripts/run-offline.py bash test/launcher-detection.test.sh
      - name: Node tests
        if: matrix.runtime == 'node'
        # Pass opt-in AFTER the offline wrapper clears ambient variables.
        env:
          QMD_BOOTSTRAP_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
        run: >-
          python scripts/run-offline.py env QMD_RECOVERY_BOOTSTRAP_DIAGNOSTICS="$QMD_BOOTSTRAP_ENABLED"
          QMD_RECOVERY_BOOTSTRAP_DIR="$RUNNER_TEMP/qmd-recovery-bootstrap"
          node node_modules/vitest/vitest.mjs run --maxWorkers=2 --reporter=verbose --testTimeout 60000 test/
      - name: Vitest suite through Bun's package-script launcher
        if: matrix.runtime == 'bun'
        # The suite uses Vitest APIs, not Bun's incomplete Vitest test shim.
        # Native Bun recovery/GC checks must not skip in this advertised runtime.
        # Set the literal requirement AFTER the offline wrapper strips ambient env.
        # CLI/SDK/SQLite/MCP-stdio and HTTP refusal are also checked below.
        # package.json explicitly invokes Node: this is not a native Bun stream trace.
        run: >-
          python scripts/run-offline.py env REQUIRE_BUN=1 QMD_RECOVERY_BOOTSTRAP_DIAGNOSTICS="$QMD_BOOTSTRAP_ENABLED"
          QMD_RECOVERY_BOOTSTRAP_DIR="$RUNNER_TEMP/qmd-recovery-bootstrap"
          bun run test --maxWorkers=2 --testTimeout 60000
        env:
          QMD_BOOTSTRAP_ENABLED: ${{ runner.os == 'macOS' && '1' || '0' }}
          DYLD_LIBRARY_PATH: /opt/homebrew/opt/sqlite/lib
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu
      - name: Real isolated tarball install and CLI/SQLite smoke
        # runtime is a fixed matrix enum, never interpolated PR/event content.
        run: python scripts/run-offline.py bash test/smoke-install.sh --runtime ${{ matrix.runtime }}
      # Explicit AFTER the canonical suite/smoke: these controls never warm its
      # first recovery invocation. They are Node-only, not native Bun coverage.
      - name: After-canonical Node diagnostic controls
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/qmd-recovery-bootstrap"
          TMPDIR="$RUNNER_TEMP" python scripts/run-offline.py node --test --test-concurrency=1 test/helpers/recovery-bootstrap-diagnostics.selftest.mjs > "$RUNNER_TEMP/qmd-recovery-bootstrap/after-canonical-selftests.tap" 2>&1
      - name: Preserve first-invocation bootstrap observations even on failure
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: recovery-bootstrap-${{ matrix.runtime }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qmd-recovery-bootstrap/*.json
            ${{ runner.temp }}/qmd-recovery-bootstrap/*.tap
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  python-portable:
    name: Python offline safety (Linux, no Metal)
    runs-on: ubuntu-latest
    # Tests invoking the real launcher/build helpers require Node, not MLX.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      # Literal commands/versions only; no PR/event text enters this shell.
      - name: Install local Node qualification dependencies without hooks
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Install portable constrained dependencies
        run: python -m pip install -r scripts/python_test_requirements.txt
      - run: python -m pip check
      # No blanket importorskip. Hardware adapter suites below are deliberately
      # separate; all selected regressions run against CPU fakes, not MLX.
      - name: Offline CPU safety and packaging regressions
        run: >-
          python scripts/run-offline.py python -m pytest -q -m 'not real_model'
          test/python/test_mlx_protocol.py
          test/python/test_mlx_batching.py
          test/python/test_mlx_executor.py
          test/python/test_mlx_model_manager.py
          test/python/test_mlx_server.py
          test/python/test_mlx_watchdog.py
          test/python/test_mlx_safeguards.py
          test/python/test_mlx_faults.py
          test/python/test_mlx_sustained.py
          test/python/test_phase5_qualification.py
          test/python/test_gguf_benchmark.py
          test/python/test_eval_offline.py
          test/python/test_audit_executor.py
          test/python/test_audit_residency.py
          test/python/test_audit_batching_runtime.py
          test/python/test_audit_embedding_adapters.py
          test/python/test_audit_stage_adapters.py
          test/python/test_audit_http.py
          test/python/test_audit_supervision.py
          test/python/test_audit_qualification.py
          test/python/test_audit_packaging.py
          test/python/test_runtime_shutdown_review.py
          test/python/test_adapter_identity_review.py
          test/python/test_stage_review_regressions.py
          test/python/test_embedding_reference_regression.py
          test/python/test_bench_apple_silicon.py
          test/python/test_server_configuration_contract.py
          test/python/test_watchdog_cli_cleanup.py
          test/python/test_process_ownership_quality.py
          test/python/test_runtime_generation_ownership.py
          test/python/test_daemon_model_selection.py
          test/python/test_qualification_review_regressions.py
          test/python/test_qualification_http_status.py

  python-macos:
    name: Python offline adapters (macOS arm64, no model weights)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      # Literal commands/versions only; no PR/event text enters this shell.
      - name: Install local Node qualification dependencies without hooks
        run: |
          bun install --frozen-lockfile --ignore-scripts
          npm rebuild better-sqlite3 --ignore-scripts=false
      - name: Require Apple Silicon rather than silently skipping MLX
        run: test "$(uname -m)" = arm64
      - name: Install tested constrained MLX and safety dependencies
        run: python -m pip install -r scripts/mlx_server_requirements.txt -r scripts/python_test_requirements.txt
      - run: python -m pip check
      - name: Full model-free Python suite
        run: python scripts/run-offline.py python -m pytest test/python -q -m 'not real_model'
      - name: Shell and launchd plist syntax
        run: |
          bash -n bin/qmd scripts/qmd-mlx-daemon.sh scripts/install-hooks.sh test/smoke-install.sh test/launcher-detection.test.sh
          plutil -lint scripts/launchd/com.qmd.mlxd.plist
